name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: srcs/client/package-lock.json

      - name: Install dependencies
        working-directory: srcs/client
        run: npm ci

      - name: Format check
        working-directory: srcs/client
        run: npm run format:check

      - name: Lint
        working-directory: srcs/client
        run: npm run lint

      - name: Type check
        working-directory: srcs/client
        run: npm run typecheck

      - name: Build
        working-directory: srcs/client
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}