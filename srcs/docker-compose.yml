services:
  app:
    build:
      context: app
    image: app:exchange_support_system
    container_name: exchange_support_system_app
    restart: on-failure
    working_dir: /usr/src/app
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - 3000:3000
    volumes:
      - ./app:/usr/src/app
      - exchange_support_system_app_node_module:/usr/src/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

volumes:
  exchange_support_system_app_node_module:
