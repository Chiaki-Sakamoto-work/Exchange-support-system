services:
  app:
    build:
      context: client
    image: app:exchange_support_system
    container_name: exchange_support_system_app
    restart: on-failure
    working_dir: /usr/src/app
    env_file:
      - .env
      - .env.local
    ports:
      - 3000:3000
      - 6006:6006
    volumes:
      - ./client:/usr/src/app
      - exchange_support_system_app_node_module:/usr/src/app/node_modules
      - /usr/src/app/.next
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

volumes:
  exchange_support_system_app_node_module:
